services:
  db:
    image: postgres:16
    container_name: osrs-flip-finder-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: osrs_flip_finder
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
